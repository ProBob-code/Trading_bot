<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoatBot Trade V2 — Strategy Performance Report</title>
    <meta name="description" content="V2 Institutional multi-strategy performance report with rankings, expectancy, and risk metrics.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* ═══ GOATBOT V2 — STRATEGY REPORT DESIGN SYSTEM ═══ */
        :root {
            --bg-deep: #05070a;
            --bg-secondary: #0a0f18;
            --panel-glass: rgba(10, 15, 24, 0.65);
            --panel-glass-hover: rgba(16, 24, 39, 0.85);
            --accent: #a855f7;        /* Goat Purple */
            --accent-glow: rgba(168, 85, 247, 0.25);
            --text-primary: #FFFFFF;
            --text-secondary: #94A3B8;
            --text-muted: #475569;
            --glass-border: rgba(255, 255, 255, 0.05);
            --glass-border-active: rgba(168, 85, 247, 0.4);
            --font-sans: 'Inter', sans-serif;
            --font-quant: 'Orbitron', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --bullish: #00FFB2;       /* Electric Mint */
            --bearish: #FF3B57;       /* Crimson Flash */
            --gold: #FFD700;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(168, 85, 247, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 255, 178, 0.04) 0%, transparent 40%);
            background-attachment: fixed;
            color: var(--text-primary);
            font-family: var(--font-sans);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ═══ HEADER ═══ */
        .report-header {
            background: rgba(10, 15, 24, 0.8);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        /* Inner wrapper keeps bar content aligned with the 1600px body column
           while the bar background/border stay full-bleed. */
        .header-inner {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
            /* Flex items default to min-width:auto and refuse to shrink below their
               content, pushing the header past the viewport on narrow screens. */
            min-width: 0;
            flex-wrap: wrap;
        }

        .header-left > * { min-width: 0; }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .brand-logo {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .logo-text {
            font-family: var(--font-quant);
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #fff;
        }

        .logo-text span {
            color: var(--accent);
        }

        .v2-badge {
            background: linear-gradient(135deg, var(--accent), #7c3aed);
            color: white;
            font-family: var(--font-quant);
            font-size: 9px;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 4px;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.2);
        }

        .report-title {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            border-left: 1px solid var(--text-muted);
            padding-left: 20px;
        }

        .back-btn {
            background: var(--panel-glass);
            border: 1px solid var(--glass-border);
            color: var(--accent);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover {
            background: var(--panel-glass-hover);
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.2);
            transform: translateY(-1px);
        }

        /* ═══ CONTROLS PANEL ═══ */
        .report-controls {
            background: rgba(10, 15, 24, 0.4);
            border-bottom: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
        }

        .controls-inner {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px 40px;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: space-between;
            align-items: center;
        }

        .control-group {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .report-controls select,
        .report-controls input {
            background: rgba(5, 7, 10, 0.8);
            color: var(--text-primary);
            border: 1px solid var(--glass-border);
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
        }

        .report-controls select:focus,
        .report-controls input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .report-controls input[type="datetime-local"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            opacity: 0.6;
        }

        .quick-filters {
            display: flex;
            gap: 6px;
        }

        .quick-filters button {
            background: var(--panel-glass);
            color: var(--text-secondary);
            border: 1px solid var(--glass-border);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .quick-filters button:hover,
        .quick-filters button.active {
            background: var(--panel-glass-hover);
            color: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .refresh-btn {
            background: var(--accent);
            color: #05070a;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-family: var(--font-quant);
            font-weight: 800;
            font-size: 13px;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .refresh-btn:hover {
            box-shadow: 0 0 20px var(--accent-glow);
            transform: translateY(-1px);
        }

        /* ═══ REPORT BODY ═══ */
        .report-body {
            padding: 40px;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        /* ═══ SUMMARY CARDS ═══ */
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .summary-card {
            background: var(--panel-glass);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
        }

        .summary-card:hover {
            border-color: var(--glass-border-active);
            box-shadow: 0 12px 30px rgba(168, 85, 247, 0.08);
            transform: translateY(-2px);
        }

        .summary-card .label {
            font-size: 10px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .summary-card .value {
            font-family: var(--font-quant);
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .summary-card .value.positive {
            color: var(--bullish);
            text-shadow: 0 0 10px rgba(0, 255, 178, 0.15);
        }

        .summary-card .value.negative {
            color: var(--bearish);
            text-shadow: 0 0 10px rgba(255, 59, 87, 0.15);
        }

        .summary-card .value.accent {
            color: var(--accent);
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.15);
        }

        /* ═══ SECTION ARCHITECTURE ═══ */
        .section-title {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            font-family: var(--font-quant);
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--glass-border);
            color: #fff;
        }

        .section-title i {
            color: var(--accent);
            font-size: 16px;
        }

        /* ═══ TABLES ═══ */
        .strategy-matrix, .trade-log {
            background: var(--panel-glass);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }

        .table-responsive-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        .matrix-table, .trade-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .matrix-table th, .trade-table th {
            color: var(--accent);
            font-family: var(--font-quant);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 16px 20px;
            border-bottom: 2px solid var(--glass-border);
            white-space: nowrap;
        }

        .matrix-table td, .trade-table td {
            padding: 16px 20px;
            font-size: 13px;
            border-bottom: 1px solid var(--glass-border);
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .matrix-table tr:hover td, .trade-table tr:hover td {
            background: rgba(255, 255, 255, 0.02);
            color: #fff;
        }

        .matrix-table tr:last-child td, .trade-table tr:last-child td {
            border-bottom: none;
        }

        .strategy-name {
            color: #fff;
            font-weight: 700;
        }

        .rank-badge {
            display: inline-block;
            width: 24px;
            height: 24px;
            border-radius: 6px;
            text-align: center;
            line-height: 24px;
            font-family: var(--font-quant);
            font-weight: 900;
            font-size: 11px;
            color: #05070a;
        }

        .rank-1 { background: var(--gold); box-shadow: 0 0 10px rgba(255, 215, 0, 0.3); }
        .rank-2 { background: #E2E8F0; }
        .rank-3 { background: #ED8936; }
        .rank-other { background: rgba(255, 255, 255, 0.1); color: var(--text-secondary); }

        .side-buy { color: var(--bullish); font-weight: 700; }
        .side-sell { color: var(--bearish); font-weight: 700; }
        .pnl-positive { color: var(--bullish); font-weight: 700; }
        .pnl-negative { color: var(--bearish); font-weight: 700; }

        /* ═══ PAGINATION ═══ */
        .pagination-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            padding-top: 24px;
            border-top: 1px solid var(--glass-border);
            margin-top: 16px;
        }

        .pagination-controls button {
            background: var(--panel-glass);
            color: var(--accent);
            border: 1px solid var(--glass-border);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .pagination-controls button:hover:not(:disabled) {
            background: var(--panel-glass-hover);
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.15);
        }

        .pagination-controls button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .page-info {
            color: var(--text-secondary);
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 500;
        }

        /* ═══ LOADING & EMPTY ═══ */
        .loading, .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .spinner {
            display: inline-block;
            width: 28px;
            height: 28px;
            border: 3px solid rgba(255, 255, 255, 0.05);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state .icon {
            font-size: 40px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .empty-state .msg {
            font-size: 14px;
            font-weight: 500;
        }

        /* ── Evolution Engine ── */
        .evo-run-btn {
            margin-left: auto;
            background: var(--panel-glass);
            border: 1px solid var(--glass-border);
            color: var(--accent);
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 11.5px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .evo-run-btn:hover { border-color: var(--accent); background: var(--panel-glass-hover); }

        .evo-intro {
            margin: -4px 0 18px;
            font-size: 12.5px;
            line-height: 1.55;
            color: var(--text-secondary);
            max-width: 760px;
        }

        .evo-strategy {
            background: rgba(5, 7, 10, 0.45);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 16px 18px;
            margin-bottom: 14px;
        }

        .evo-head {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .evo-name { font-size: 14px; font-weight: 800; color: var(--text-primary); }

        .evo-gen {
            font-family: var(--font-quant, monospace);
            font-size: 10.5px;
            font-weight: 800;
            letter-spacing: 0.8px;
            padding: 3px 10px;
            border-radius: 20px;
            background: rgba(124, 58, 237, 0.18);
            border: 1px solid rgba(124, 58, 237, 0.5);
            color: #c4b5fd;
        }
        .evo-badge {
            font-size: 9.5px; font-weight: 800; letter-spacing: 0.6px;
            padding: 3px 9px; border-radius: 4px; text-transform: uppercase;
        }
        .evo-badge.active { background: rgba(0,255,178,0.12); color: var(--bullish); border: 1px solid rgba(0,255,178,0.4); }
        .evo-badge.paused { background: rgba(255,51,102,0.12); color: var(--bearish); border: 1px solid rgba(255,51,102,0.4); }
        .evo-badge.learning { background: rgba(245,158,11,0.12); color: #f59e0b; border: 1px solid rgba(245,158,11,0.4); }

        .evo-params { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .evo-param {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 7px 11px;
            font-size: 11.5px;
        }
        .evo-param .k { color: var(--text-muted); text-transform: uppercase; font-size: 9.5px; letter-spacing: 0.5px; display: block; }
        .evo-param .v { color: var(--text-primary); font-weight: 700; font-family: var(--font-mono, monospace); }
        .evo-param .orig { color: var(--text-muted); text-decoration: line-through; margin-right: 5px; font-weight: 400; }
        .evo-param.changed { border-color: rgba(124,58,237,0.55); background: rgba(124,58,237,0.08); }

        .evo-progress { margin: 10px 0 4px; }
        .evo-bar { height: 6px; background: rgba(255,255,255,0.06); border-radius: 4px; overflow: hidden; }
        .evo-bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), #7c3aed); }
        .evo-progress .lbl { font-size: 10.5px; color: var(--text-muted); margin-bottom: 5px; }

        /* Evolve meter */
        .evo-meter { margin: 12px 0; }
        .evo-meter .lbl {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 10.5px; color: var(--text-muted); margin-bottom: 6px;
        }
        .evo-meter .track {
            height: 10px; background: rgba(255,255,255,0.06);
            border-radius: 6px; overflow: hidden; position: relative;
        }
        .evo-meter .fill {
            display: block; height: 100%;
            background: linear-gradient(90deg, var(--accent), #7c3aed);
            transition: width 0.5s ease;
        }
        .evo-meter.full .fill {
            background: linear-gradient(90deg, #00FFB2, #7c3aed);
            box-shadow: 0 0 14px rgba(0, 255, 178, 0.5);
        }

        /* Lesson-learned card (awaiting Proceed) */
        .evo-lesson {
            margin-top: 12px;
            border: 1px solid rgba(0, 255, 178, 0.4);
            background: linear-gradient(135deg, rgba(0,255,178,0.06), rgba(124,58,237,0.06));
            border-radius: 12px;
            padding: 14px 16px;
        }
        .evo-lesson-head {
            display: flex; align-items: center; gap: 9px;
            font-size: 12.5px; font-weight: 800; color: var(--bullish);
            text-transform: uppercase; letter-spacing: 0.7px; margin-bottom: 10px;
        }
        .evo-lesson-item { margin-bottom: 10px; }
        .evo-lesson-item:last-of-type { margin-bottom: 4px; }
        .evo-actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
        .evo-proceed {
            background: linear-gradient(135deg, #00FFB2, #00c98d);
            color: #04120c; border: none; padding: 10px 22px; border-radius: 8px;
            font-size: 12.5px; font-weight: 800; cursor: pointer; letter-spacing: 0.4px;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .evo-proceed:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0,255,178,0.3); }
        .evo-dismiss {
            background: transparent; border: 1px solid var(--glass-border);
            color: var(--text-secondary); padding: 10px 18px; border-radius: 8px;
            font-size: 12.5px; font-weight: 600; cursor: pointer;
        }
        .evo-dismiss:hover { border-color: var(--bearish); color: var(--bearish); }

        .evo-symbol {
            font-family: var(--font-mono, monospace);
            font-size: 11px; font-weight: 800; color: var(--accent);
            background: rgba(0,255,178,0.08); border: 1px solid rgba(0,255,178,0.3);
            padding: 2px 8px; border-radius: 4px;
        }

        .evo-regime {
            font-size: 9.5px; font-weight: 800; letter-spacing: 0.6px;
            padding: 3px 9px; border-radius: 4px; text-transform: uppercase;
            background: rgba(59,130,246,0.14); color: #93c5fd; border: 1px solid rgba(59,130,246,0.4);
        }
        .evo-profiles { font-size: 10.5px; color: var(--text-muted); margin-top: 8px; }
        .evo-profiles b { color: var(--text-secondary); }

        .evo-gens { margin-top: 12px; border-top: 1px solid var(--glass-border); padding-top: 12px; }
        .evo-gen-row { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px dashed rgba(255,255,255,0.05); }
        .evo-gen-row:last-child { border-bottom: none; }
        .evo-gen-num {
            flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%;
            background: rgba(124,58,237,0.15); border: 1px solid rgba(124,58,237,0.4);
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 800; color: #c4b5fd;
        }
        .evo-gen-body { flex: 1; min-width: 0; }
        .evo-change { font-size: 12px; color: var(--text-primary); font-weight: 600; }
        .evo-reason { font-size: 11.5px; color: var(--text-secondary); line-height: 1.5; margin-top: 3px; }
        .evo-meta { font-size: 10.5px; color: var(--text-muted); margin-top: 4px; }
        .evo-arrow { color: var(--accent); font-family: var(--font-mono, monospace); }

        /* ── Download menu ── */
        .download-wrap { position: relative; }

        .download-menu {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            width: 250px;
            /* 100vw counts the scrollbar gutter and so exceeds the visible width;
               100% resolves against the positioned ancestor instead. */
            max-width: calc(100% - 32px);
            background: #111a29;
            border: 1px solid rgba(124, 58, 237, 0.35);
            border-radius: 12px;
            box-shadow: 0 18px 46px rgba(0, 0, 0, 0.7);
            padding: 14px;
            z-index: 1400;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .download-menu[hidden] { display: none; }

        .download-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .download-menu select {
            width: 100%;
            background: rgba(5, 7, 10, 0.8);
            color: var(--text-primary);
            border: 1px solid var(--glass-border);
            padding: 9px 10px;
            border-radius: 8px;
            font-size: 12.5px;
            outline: none;
        }

        .dl-opt {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            background: var(--panel-glass);
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .dl-opt:hover { border-color: var(--accent); color: #fff; }

        .download-hint {
            margin: 2px 0 0;
            font-size: 10.5px;
            line-height: 1.45;
            color: var(--text-muted);
            min-height: 12px;
        }

        /* ── Responsive: tablet & mobile ── */
        @media (max-width: 900px) {
            .header-inner,
            .controls-inner,
            .report-body { padding-left: 16px; padding-right: 16px; }
            .report-body { padding-top: 20px; padding-bottom: 20px; }
            .controls-inner { gap: 12px; }
            .control-group { flex-wrap: wrap; }
            .report-controls select,
            .report-controls input { flex: 1 1 auto; min-width: 0; }
            .quick-filters { flex-wrap: wrap; }
            .summary-cards { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
            .panel { padding: 20px 16px; }
        }

        @media (max-width: 560px) {
            .report-header .report-title { display: none; }
            .header-inner { flex-wrap: wrap; gap: 10px; }
            .back-btn { padding: 8px 14px; font-size: 12px; }
            .summary-cards { grid-template-columns: 1fr 1fr; gap: 12px; }
            .summary-card .value { font-size: 20px; }
            .control-group,
            .quick-filters { width: 100%; }
            .refresh-btn { width: 100%; justify-content: center; }
            /* keep tables scrolling inside their wrapper, never the page */
            .matrix-table, .trade-table { min-width: 640px; }
            body { overflow-x: hidden; }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <header class="report-header">
      <div class="header-inner">
        <div class="header-left">
            <a href="/godbot_home" class="brand">
                <img src="/logo.svg" alt="GoatBot" class="brand-logo">
                <span class="logo-text">GOATBOT<span>TRADE</span></span>
            </a>
            <span class="v2-badge">V2 INSTITUTIONAL</span>
            <span class="report-title">Strategy Performance Report</span>
        </div>
        <a href="/godbot_home" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i> Return to Command Deck
        </a>
      </div>
    </header>

    <!-- CONTROLS -->
    <div class="report-controls">
      <div class="controls-inner">
        <div class="control-group">
            <select id="strategyFilter" onchange="loadAllReportData()">
                <option value="">All Strategies</option>
                <!-- Public catalog codes only. Populated from /api/v2/strategies
                     so the underlying technique is never published here. -->
                <option value="GBX-01">Adaptive Core</option>
                <option value="GBX-02">Trend Rider</option>
                <option value="GBX-03">Range Fader</option>
                <option value="GBX-04">Flow Momentum</option>
                <option value="GBX-05">Predictive Model</option>
                <option value="GBX-06">Multi-Signal Ensemble</option>
                <option value="GBX-07">Statistical Reversion</option>
                <option value="GBX-08">Persistence Engine</option>
            </select>

            <select id="sessionFilter" onchange="handleSessionChange()">
                <option value="">All Sessions</option>
            </select>
        </div>

        <div class="control-group">
            <input type="datetime-local" id="fromDate" onchange="loadAllReportData()">
            <span style="color: var(--text-secondary); font-size: 13px; font-weight: 500;">to</span>
            <input type="datetime-local" id="toDate" onchange="loadAllReportData()">
        </div>

        <div class="quick-filters" id="quickFilters">
            <button onclick="setQuickFilter('today')">Today</button>
            <button onclick="setQuickFilter('24h')">24h</button>
            <button onclick="setQuickFilter('7d')">7D</button>
            <button onclick="setQuickFilter('30d')">30D</button>
            <button onclick="setQuickFilter('all')" class="active">All</button>
        </div>

        <div class="control-group">
            <button class="refresh-btn" onclick="loadAllReportData()">
                <i class="fa-solid fa-arrows-rotate"></i> Refresh Matrix
            </button>
            <div class="download-wrap">
                <button class="refresh-btn download-btn" onclick="toggleDownloadMenu(event)">
                    <i class="fa-solid fa-download"></i> Download
                </button>
                <div class="download-menu" id="downloadMenu" hidden>
                    <div class="download-label">Range</div>
                    <select id="downloadRange">
                        <option value="current">Current filters (as shown)</option>
                        <option value="today">Today</option>
                        <option value="7d">Last 7 days</option>
                        <option value="30d">Last 30 days</option>
                        <option value="90d">Last 90 days</option>
                        <option value="all">All time</option>
                    </select>
                    <div class="download-label">Format</div>
                    <button class="dl-opt" onclick="downloadReport('csv')">
                        <i class="fa-solid fa-file-csv"></i> CSV (.csv)
                    </button>
                    <button class="dl-opt" onclick="downloadReport('excel')">
                        <i class="fa-solid fa-file-excel"></i> Excel (.xls)
                    </button>
                    <p class="download-hint" id="downloadStatus"></p>
                </div>
            </div>
        </div>
      </div>
    </div>

    <!-- BODY -->
    <div class="report-body">

        <!-- SUMMARY CARDS -->
        <div class="summary-cards" id="summaryCards">
            <div class="summary-card">
                <div class="label">Account Equity</div>
                <div class="value accent" id="cardEquity">—</div>
            </div>
            <div class="summary-card">
                <div class="label">Total P&L</div>
                <div class="value" id="cardPnl">—</div>
            </div>
            <div class="summary-card">
                <div class="label">Total Trades</div>
                <div class="value accent" id="cardTrades">—</div>
            </div>
            <div class="summary-card">
                <div class="label">Win Rate</div>
                <div class="value" id="cardWinRate">—</div>
            </div>
            <div class="summary-card">
                <div class="label">Best Strategy</div>
                <div class="value accent" id="cardBestStrategy">—</div>
            </div>
            <div class="summary-card">
                <div class="label">Max Drawdown</div>
                <div class="value" id="cardDrawdown">—</div>
            </div>
        </div>

        <!-- STRATEGY PERFORMANCE MATRIX -->
        <div class="strategy-matrix">
            <div class="section-title">
                <i class="fa-solid fa-chart-line"></i>
                <span>Strategy Performance Matrix</span>
            </div>
            <div class="table-responsive-wrapper" id="matrixContainer">
                <div class="loading"><div class="spinner"></div><div class="msg">Loading strategy data...</div></div>
            </div>
        </div>

        <!-- TRADE LOG -->
        <div class="trade-log">
            <div class="section-title">
                <i class="fa-solid fa-receipt"></i>
                <span>V2 Systematic Trade Ledger</span>
                <span id="tradeTotalCount" style="margin-left: auto; font-family: var(--font-mono); font-size: 12px; color: var(--text-secondary);"></span>
            </div>
            <div class="table-responsive-wrapper" id="tradeLogContainer" style="min-height: 200px;">
                <div class="loading"><div class="spinner"></div><div class="msg">Loading trades...</div></div>
            </div>
            <div class="pagination-controls" id="paginationControls">
                <button id="prevBtn" onclick="changePage(-1)"><i class="fa-solid fa-chevron-left"></i> Previous</button>
                <div class="page-info" id="pageInfo">Page 1 of 1</div>
                <button id="nextBtn" onclick="changePage(1)">Next <i class="fa-solid fa-chevron-right"></i></button>
            </div>
        </div>
    </div>

    <script>
        /**
         * GoatBot V2 Report Page — Strategy Performance & Trade Ledger
         */

        // Public catalog codes -> display names. The internal strategy ids
        // (which name the technique) are never sent to this page.
        const STRATEGY_NAMES = {
            'GBX-01': 'Adaptive Core',
            'GBX-02': 'Trend Rider',
            'GBX-03': 'Range Fader',
            'GBX-04': 'Flow Momentum',
            'GBX-05': 'Predictive Model',
            'GBX-06': 'Multi-Signal Ensemble',
            'GBX-07': 'Statistical Reversion',
            'GBX-08': 'Persistence Engine'
        };

        function fmt$(val) {
            const n = parseFloat(val) || 0;
            return `$${n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        }

        function fmtPct(val, decimals = 2) {
            const n = parseFloat(val) || 0;
            return `${n >= 0 ? '+' : ''}${n.toFixed(decimals)}%`;
        }

        function pnlClass(val) {
            const n = parseFloat(val) || 0;
            return n >= 0 ? 'positive' : 'negative';
        }

        function rankBadge(rank) {
            let className = 'rank-other';
            if (rank === 1) className = 'rank-1';
            else if (rank === 2) className = 'rank-2';
            else if (rank === 3) className = 'rank-3';
            return `<span class="rank-badge ${className}">${rank}</span>`;
        }

        // ═══ STATE ═══
        let currentSessionId = null;
        let autoRefreshInterval = null;
        let tradeOffset = 0;
        const tradeLimit = 50;
        let totalTrades = 0;

        window.onload = initPage;

        async function initPage() {
            await Promise.all([
                loadSessions(),
                fetchCurrentSession()
            ]);

            // Default to current session on first load
            if (currentSessionId) {
                document.getElementById('sessionFilter').value = currentSessionId;
            }

            await loadAllReportData();
            startAutoRefresh();
        }

        // ═══ DATA LOADING ═══

        async function loadAllReportData(resetPagination = false) {
            await Promise.all([
                loadAccount(),
                loadStrategyMatrix(),
                loadTradeHistory(resetPagination)
            ]);
        }

        async function fetchCurrentSession() {
            try {
                const res = await fetch('/api/v2/current-session');
                const data = await res.json();
                if (data.success) {
                    currentSessionId = data.session_id;
                }
            } catch (e) {
                console.error('Failed to fetch current session:', e);
            }
        }

        async function loadSessions() {
            try {
                const res = await fetch('/api/v2/sessions');
                const data = await res.json();
                if (data.success) {
                    const select = document.getElementById('sessionFilter');
                    const currentVal = select.value;
                    select.innerHTML = '<option value="">All Sessions</option>';

                    data.sessions.forEach(s => {
                        const dateStr = s.start_time ? new Date(s.start_time).toLocaleString(undefined, {
                            month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
                        }) : 'Unknown';
                        const opt = document.createElement('option');
                        opt.value = s.session_id;

                        const pnl = parseFloat(s.total_pnl || 0);
                        const pnlSymbol = pnl >= 0 ? '+' : '';
                        const statusBadge = s.status === 'ACTIVE' ? '🟢' : '⚪';

                        opt.textContent = `${statusBadge} ${s.session_id} (${dateStr}) — ${s.total_trades} trades — ${pnlSymbol}${pnl.toFixed(2)} PNL`;
                        select.appendChild(opt);
                    });

                    if (currentVal) select.value = currentVal;
                }
            } catch (e) {
                console.error('Failed to load sessions:', e);
            }
        }

        function handleSessionChange() {
            // Clear dates when session is selected to avoid conflict
            if (document.getElementById('sessionFilter').value) {
                document.getElementById('fromDate').value = '';
                document.getElementById('toDate').value = '';
                resetQuickFilterButtons('all');
            }
            loadAllReportData(true);
        }

        function setQuickFilter(type) {
            resetQuickFilterButtons(type);
            const now = new Date();
            let fromDate = null;

            if (type === 'today') {
                fromDate = new Date();
                fromDate.setHours(0, 0, 0, 0);
            } else if (type === '24h') {
                fromDate = new Date(now - 24 * 60 * 60 * 1000);
            } else if (type === '7d') {
                fromDate = new Date(now - 7 * 24 * 60 * 60 * 1000);
            } else if (type === '30d') {
                fromDate = new Date(now - 30 * 24 * 60 * 60 * 1000);
            }

            if (fromDate) {
                const offset = fromDate.getTimezoneOffset() * 60000;
                const localISODate = new Date(fromDate - offset).toISOString().slice(0, 16);
                const nowISO = new Date(now - offset).toISOString().slice(0, 16);
                document.getElementById('fromDate').value = localISODate;
                document.getElementById('toDate').value = nowISO;
                // Clear session filter
                document.getElementById('sessionFilter').value = '';
            } else {
                document.getElementById('fromDate').value = '';
                document.getElementById('toDate').value = '';
            }

            loadAllReportData(true);
        }

        function resetQuickFilterButtons(activeType) {
            document.querySelectorAll('.quick-filters button').forEach(btn => {
                btn.classList.remove('active');
                if (activeType === 'all' && btn.textContent.toLowerCase() === 'all') btn.classList.add('active');
                else if (btn.textContent.toLowerCase().includes(activeType)) btn.classList.add('active');
            });
        }

        // ═══ REPORT DOWNLOAD (CSV / Excel) ═══

        function toggleDownloadMenu(evt) {
            if (evt) evt.stopPropagation();
            const m = document.getElementById('downloadMenu');
            if (!m) return;
            if (m.hasAttribute('hidden')) {
                m.removeAttribute('hidden');
                document.getElementById('downloadStatus').textContent = '';
            } else {
                m.setAttribute('hidden', '');
            }
        }

        document.addEventListener('click', (e) => {
            const m = document.getElementById('downloadMenu');
            const w = document.querySelector('.download-wrap');
            if (m && !m.hasAttribute('hidden') && w && !w.contains(e.target)) {
                m.setAttribute('hidden', '');
            }
        });

        /** Build query params for the chosen download range. */
        function getDownloadParams() {
            const range = document.getElementById('downloadRange').value;
            if (range === 'current') return { params: getFilterParams(), label: 'filtered' };

            const params = new URLSearchParams();
            // keep the strategy/session context, only override the dates
            const strategy = document.getElementById('strategyFilter').value;
            const session = document.getElementById('sessionFilter').value;
            if (strategy) params.append('strategy', strategy);
            if (session) params.append('session_id', session);

            if (range !== 'all') {
                const days = { today: 1, '7d': 7, '30d': 30, '90d': 90 }[range] || 1;
                const to = new Date();
                const from = new Date();
                if (range === 'today') from.setHours(0, 0, 0, 0);
                else from.setDate(from.getDate() - days);
                params.append('start_date', from.toISOString());
                params.append('end_date', to.toISOString());
            }
            return { params: params.toString(), label: range };
        }

        function csvCell(v) {
            const s = (v === null || v === undefined) ? '' : String(v);
            return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
        }

        const EXPORT_COLUMNS = [
            ['Time', t => t.timestamp ? new Date(t.timestamp).toLocaleString() : ''],
            ['Trade ID', t => t.trade_id || ''],
            ['Session', t => t.session_id || ''],
            ['Symbol', t => t.symbol || ''],
            ['Strategy', t => STRATEGY_NAMES[t.strategy] || t.strategy || ''],
            ['Action', t => t.action || ''],
            ['Side', t => t.side || ''],
            ['Quantity', t => parseFloat(t.quantity) || 0],
            ['Price', t => parseFloat(t.price ?? t.fill_price) || 0],
            ['Commission', t => parseFloat(t.commission) || 0],
            ['P&L', t => parseFloat(t.pnl ?? t.net_pnl ?? t.realized_pnl) || 0]
        ];

        function triggerDownload(content, filename, mime) {
            const blob = new Blob([content], { type: mime });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        async function downloadReport(format) {
            const status = document.getElementById('downloadStatus');
            status.textContent = 'Preparing…';
            try {
                const { params, label } = getDownloadParams();
                // pull the whole matching set, not just the visible page
                const res = await fetch(`/api/v2/trades?${params}&limit=5000&offset=0`);
                const data = await res.json();
                if (!data.success) throw new Error(data.error || 'request failed');

                const trades = data.trades || [];
                if (!trades.length) {
                    status.textContent = 'No trades in that range.';
                    return;
                }

                const headers = EXPORT_COLUMNS.map(c => c[0]);
                const rows = trades.map(t => EXPORT_COLUMNS.map(c => c[1](t)));

                // summary block so the file is self-describing
                const totalPnl = rows.reduce((s, r) => s + (parseFloat(r[10]) || 0), 0);
                const totalComm = rows.reduce((s, r) => s + (parseFloat(r[9]) || 0), 0);
                const closed = trades.filter(t => ['CLOSE', 'STOP_LOSS', 'TAKE_PROFIT', 'REVERSAL'].includes(t.action));
                const wins = closed.filter(t => (parseFloat(t.pnl) || 0) > 0).length;
                const winRate = closed.length ? (wins / closed.length * 100).toFixed(1) + '%' : '—';
                const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
                const fname = `goatbot_report_${label}_${stamp}`;

                if (format === 'csv') {
                    const lines = [];
                    lines.push(['GoatBot Trade — V2 Trade Ledger'].map(csvCell).join(','));
                    lines.push(['Generated', new Date().toLocaleString()].map(csvCell).join(','));
                    lines.push(['Range', label].map(csvCell).join(','));
                    lines.push(['Trades', trades.length, 'Closed', closed.length, 'Win Rate', winRate].map(csvCell).join(','));
                    lines.push(['Total P&L', totalPnl.toFixed(2), 'Total Commission', totalComm.toFixed(2)].map(csvCell).join(','));
                    lines.push('');
                    lines.push(headers.map(csvCell).join(','));
                    rows.forEach(r => lines.push(r.map(csvCell).join(',')));
                    triggerDownload('﻿' + lines.join('\r\n'), fname + '.csv', 'text/csv;charset=utf-8;');
                } else {
                    // Excel-readable HTML table (.xls) — no external library needed
                    const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    let h = '<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"></head><body>';
                    h += '<table border="1"><tr><th colspan="11" style="background:#7c3aed;color:#fff">GoatBot Trade — V2 Trade Ledger</th></tr>';
                    h += `<tr><td>Generated</td><td colspan="10">${esc(new Date().toLocaleString())}</td></tr>`;
                    h += `<tr><td>Range</td><td colspan="10">${esc(label)}</td></tr>`;
                    h += `<tr><td>Trades</td><td>${trades.length}</td><td>Closed</td><td>${closed.length}</td><td>Win Rate</td><td>${esc(winRate)}</td><td>Total P&amp;L</td><td>${totalPnl.toFixed(2)}</td><td>Commission</td><td colspan="2">${totalComm.toFixed(2)}</td></tr>`;
                    h += '<tr></tr><tr>' + headers.map(x => `<th style="background:#1f2937;color:#fff">${esc(x)}</th>`).join('') + '</tr>';
                    rows.forEach(r => { h += '<tr>' + r.map(c => `<td>${esc(c)}</td>`).join('') + '</tr>'; });
                    h += '</table></body></html>';
                    triggerDownload(h, fname + '.xls', 'application/vnd.ms-excel;charset=utf-8;');
                }

                status.textContent = `Downloaded ${trades.length} trades.`;
            } catch (e) {
                console.error('[REPORT] download failed:', e);
                status.textContent = 'Download failed: ' + e.message;
            }
        }

        function getFilterParams() {
            const strategy = document.getElementById('strategyFilter').value;
            const session = document.getElementById('sessionFilter').value;
            const fromDate = document.getElementById('fromDate').value;
            const toDate = document.getElementById('toDate').value;

            let params = new URLSearchParams();
            if (strategy) params.append('strategy', strategy);
            if (session) params.append('session_id', session);
            if (fromDate) params.append('start_date', new Date(fromDate).toISOString());
            if (toDate) params.append('end_date', new Date(toDate).toISOString());

            return params.toString();
        }

        function startAutoRefresh() {
            if (autoRefreshInterval) clearInterval(autoRefreshInterval);
            autoRefreshInterval = setInterval(() => {
                const session = document.getElementById('sessionFilter').value;
                // Refresh if current session is selected or if viewing "All" without date filters
                if (session === currentSessionId || (!session && !document.getElementById('fromDate').value)) {
                    loadAllReportData();
                    loadSessions(); // Update trade counts in dropdown
                }
            }, 10000);
        }

        async function loadAccount() {
            try {
                const res = await fetch('/api/v2/account');
                const data = await res.json();
                if (data.success) {
                    document.getElementById('cardEquity').textContent = fmt$(data.equity || data.total_value || 100000);
                    const pnl = data.pnl || 0;
                    const pnlEl = document.getElementById('cardPnl');
                    pnlEl.textContent = fmt$(pnl);
                    pnlEl.className = `value ${pnlClass(pnl)}`;
                }
            } catch (e) {
                console.error('Failed to load account:', e);
            }
        }

        async function loadStrategyMatrix() {
            const container = document.getElementById('matrixContainer');
            const params = getFilterParams();
            try {
                // Fetch both metrics and ranking
                const [metricsRes, rankingRes] = await Promise.all([
                    fetch(`/api/v2/reports/strategy-benchmark?${params}`),
                    fetch(`/api/v2/reports/strategy-ranking?${params}`)
                ]);
                const metricsData = await metricsRes.json();
                const rankingData = await rankingRes.json();

                const metrics = metricsData.metrics || [];
                const ranking = rankingData.ranking || [];

                if (metrics.length === 0 && ranking.length === 0) {
                    container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon"><i class="fa-solid fa-folder-open"></i></div>
                        <div class="msg">No strategy data yet. Start trading to see performance metrics.</div>
                    </div>`;
                    // Set summary cards for empty state
                    // (cardTrades is owned by loadTradeHistory = real ledger total)
                    document.getElementById('cardWinRate').textContent = '—';
                    document.getElementById('cardBestStrategy').textContent = '—';
                    document.getElementById('cardDrawdown').textContent = '—';
                    return;
                }

                // Build lookup: strategy → rank
                const rankMap = {};
                ranking.forEach((r, i) => {
                    rankMap[r.strategy || r.name] = i + 1;
                });

                // Sort metrics by rank (or by total_pnl if unranked)
                const sorted = [...metrics].sort((a, b) => {
                    const rA = rankMap[a.strategy] || 999;
                    const rB = rankMap[b.strategy] || 999;
                    return rA - rB;
                });

                // Aggregate totals for summary cards
                let totalTrades = 0, totalWins = 0, totalLosses = 0, totalPnl = 0;
                let bestPnl = -Infinity, bestStrategy = '—', worstDD = 0;

                sorted.forEach(m => {
                    totalTrades += (m.total_trades || 0);
                    totalWins += (m.wins || 0);
                    totalLosses += (m.losses || 0);
                    totalPnl += (m.total_pnl || 0);
                    if ((m.total_pnl || 0) > bestPnl) {
                        bestPnl = m.total_pnl || 0;
                        bestStrategy = STRATEGY_NAMES[m.strategy] || m.strategy;
                    }
                    if ((m.max_drawdown_pct || 0) > worstDD) {
                        worstDD = m.max_drawdown_pct || 0;
                    }
                });

                // Update summary cards (cardTrades owned by loadTradeHistory = ledger total)
                const winRate = totalTrades > 0 ? ((totalWins / totalTrades) * 100) : 0;
                const wrEl = document.getElementById('cardWinRate');
                wrEl.textContent = `${winRate.toFixed(1)}%`;
                wrEl.className = `value ${winRate >= 50 ? 'positive' : 'negative'}`;
                document.getElementById('cardBestStrategy').textContent = bestStrategy;
                const ddEl = document.getElementById('cardDrawdown');
                ddEl.textContent = `-${worstDD.toFixed(2)}%`;
                ddEl.className = `value ${worstDD > 5 ? 'negative' : 'positive'}`;

                // Also update total P&L if not set by account
                const pnlEl = document.getElementById('cardPnl');
                if (pnlEl.textContent === '—') {
                    pnlEl.textContent = fmt$(totalPnl);
                    pnlEl.className = `value ${pnlClass(totalPnl)}`;
                }

                // Render table
                let html = `<table class="matrix-table">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Strategy</th>
                        <th>Trades</th>
                        <th>Wins</th>
                        <th>Losses</th>
                        <th>Win Rate</th>
                        <th>Total P&L</th>
                        <th>Expectancy</th>
                        <th>Profit Factor</th>
                        <th>Sharpe</th>
                        <th>Sortino</th>
                        <th>Max DD</th>
                    </tr>
                </thead>
                <tbody>`;

                sorted.forEach(m => {
                    const rank = rankMap[m.strategy] || '—';
                    const wr = m.total_trades > 0 ? ((m.wins / m.total_trades) * 100).toFixed(1) : '—';
                    const pnl = m.total_pnl || 0;
                    const exp = m.expectancy || 0;
                    const pf = m.profit_factor || 0;

                    html += `<tr>
                    <td>${typeof rank === 'number' ? rankBadge(rank) : rank}</td>
                    <td class="strategy-name">${STRATEGY_NAMES[m.strategy] || m.strategy}</td>
                    <td>${m.total_trades || 0}</td>
                    <td style="color: var(--bullish); font-weight: 700;">${m.wins || 0}</td>
                    <td style="color: var(--bearish); font-weight: 700;">${m.losses || 0}</td>
                    <td class="${parseFloat(wr) >= 50 ? 'pnl-positive' : 'pnl-negative'}">${wr}%</td>
                    <td class="${pnlClass(pnl)}">${fmt$(pnl)}</td>
                    <td class="${pnlClass(exp)}">${exp.toFixed(3)}</td>
                    <td>${pf.toFixed(2)}</td>
                    <td>${(m.sharpe_ratio || 0).toFixed(2)}</td>
                    <td>${(m.sortino_ratio || 0).toFixed(2)}</td>
                    <td class="pnl-negative">-${(m.max_drawdown_pct || 0).toFixed(2)}%</td>
                </tr>`;
                });

                html += '</tbody></table>';
                container.innerHTML = html;

            } catch (e) {
                console.error('Failed to load strategy matrix:', e);
                container.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><div class="msg">Error loading strategy data</div></div>`;
            }
        }

        async function loadTradeHistory(resetOffset = false) {
            if (resetOffset) tradeOffset = 0;
            const container = document.getElementById('tradeLogContainer');
            const params = getFilterParams();
            const url = `/api/v2/trades?${params}&limit=${tradeLimit}&offset=${tradeOffset}`;

            try {
                const res = await fetch(url);
                const data = await res.json();

                if (data.success) {
                    totalTrades = data.total;
                    document.getElementById('tradeTotalCount').textContent = `Stored Trades: ${totalTrades}`;
                    // TOTAL TRADES card = full ledger count (incl. open entries), so it
                    // reconciles with the top-bar counter. The strategy matrix separately
                    // reports closed-trade metrics and must NOT override this.
                    document.getElementById('cardTrades').textContent = totalTrades;
                    renderTradeLedger(data.trades);
                    updatePaginationUI();
                }
            } catch (e) {
                console.error('Failed to load trades:', e);
                container.innerHTML = `<div class="error">Failed to load trades: ${e}</div>`;
            }
        }

        function updatePaginationUI() {
            const totalPages = Math.ceil(totalTrades / tradeLimit) || 1;
            const currentPage = Math.floor(tradeOffset / tradeLimit) + 1;

            document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
            document.getElementById('prevBtn').disabled = tradeOffset === 0;
            document.getElementById('nextBtn').disabled = (tradeOffset + tradeLimit) >= totalTrades;

            // Hide pagination if zero trades
            document.getElementById('paginationControls').style.display = totalTrades > 0 ? 'flex' : 'none';
        }

        function changePage(delta) {
            tradeOffset += delta * tradeLimit;
            if (tradeOffset < 0) tradeOffset = 0;
            loadTradeHistory(false);

            // Smooth scroll to top of log
            document.querySelector('.trade-log').scrollIntoView({ behavior: 'smooth' });
        }

        function renderTradeLedger(trades) {
            const container = document.getElementById('tradeLogContainer');
            if (trades.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon"><i class="fa-solid fa-receipt"></i></div>
                        <div class="msg">No V2 trades recorded yet.</div>
                    </div>`;
                return;
            }

            let html = `<table class="trade-table">
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Trade ID</th>
                        <th>Symbol</th>
                        <th>Strategy</th>
                        <th>Type</th>
                        <th>Direction</th>
                        <th>Side</th>
                        <th>Qty</th>
                        <th>Entry Price</th>
                        <th>Fill Price</th>
                        <th>Duration</th>
                        <th>Spread</th>
                        <th>Slippage</th>
                        <th>Commission</th>
                        <th>Leverage</th>
                        <th>Realized P&L</th>
                        <th>Net P&L</th>
                    </tr>
                </thead>
                <tbody>`;

            // Format duration in human-readable form
            function fmtDuration(seconds) {
                if (!seconds && seconds !== 0) return '—';
                if (seconds < 60) return `${Math.round(seconds)}s`;
                if (seconds < 3600) return `${Math.floor(seconds / 60)}m ${Math.round(seconds % 60)}s`;
                const h = Math.floor(seconds / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                return `${h}h ${m}m`;
            }

            const closedTrades = trades.filter(t => (t.trade_type || t.type) === 'CLOSE');

            trades.forEach(t => {
                const ts = t.timestamp ? new Date(t.timestamp).toLocaleString() : '—';
                const side = (t.side || '').toUpperCase();
                const sideClass = side.includes('BUY') ? 'side-buy' : 'side-sell';
                const rpnl = t.realized_pnl ?? 0;
                const npnl = t.net_pnl ?? t.realized_pnl ?? 0;
                const tradeType = t.trade_type || t.type || '—';
                const direction = t.direction || t.position_side || '—';
                const tradeId = t.trade_id ? t.trade_id.slice(-12) : '—';

                html += `<tr>
                    <td>${ts}</td>
                    <td style="font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary)">${tradeId}</td>
                    <td style="color: var(--text-primary); font-weight:700">${t.symbol || '—'}</td>
                    <td>${STRATEGY_NAMES[t.strategy] || t.strategy || '—'}</td>
                    <td><span style="color:${tradeType === 'CLOSE' ? '#f59e0b' : '#3b82f6'}; font-weight:700">${tradeType}</span></td>
                    <td>${direction}</td>
                    <td class="${sideClass}">${side}</td>
                    <td>${(parseFloat(t.quantity) || 0).toFixed(4)}</td>
                    <td>${t.entry_price ? fmt$(t.entry_price) : '—'}</td>
                    <td>${fmt$(t.fill_price)}</td>
                    <td>${fmtDuration(t.duration_seconds)}</td>
                    <td>${(parseFloat(t.spread_pct) || 0).toFixed(3)}%</td>
                    <td>${(parseFloat(t.slippage_pct) || 0).toFixed(3)}%</td>
                    <td>${fmt$(t.commission)}</td>
                    <td>${(t.leverage || 1)}×</td>
                    <td class="${pnlClass(rpnl)}">${fmt$(rpnl)}</td>
                    <td class="${pnlClass(npnl)}">${fmt$(npnl)}</td>
                </tr>`;
            });

            html += '</tbody></table>';
            container.innerHTML = html;

            // Trade Duration Analytics Summary
            const existingSummary = document.getElementById('tradeDurationSummary');
            if (existingSummary) existingSummary.remove();

            if (closedTrades.length > 0) {
                const durations = closedTrades.map(t => t.duration_seconds).filter(d => d !== undefined && d !== null);
                if (durations.length > 0) {
                    const avgDuration = durations.reduce((a, b) => a + b, 0) / durations.length;
                    const maxDuration = Math.max(...durations);
                    const minDuration = Math.min(...durations);

                    const summaryHtml = `
                        <div id="tradeDurationSummary" style="display: flex; gap: 20px; margin-top: 20px; padding: 24px; background: var(--panel-glass); border-radius: 16px; border: 1px solid var(--glass-border); backdrop-filter: blur(10px);">
                            <div style="flex: 1;">
                                <div style="color: var(--text-secondary); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px;">Avg Trade Duration</div>
                                <div style="color: var(--text-primary); font-family: var(--font-quant); font-size: 18px; font-weight: 800;">${fmtDuration(avgDuration)}</div>
                            </div>
                            <div style="flex: 1;">
                                <div style="color: var(--text-secondary); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px;">Longest Trade</div>
                                <div style="color: var(--text-primary); font-family: var(--font-quant); font-size: 18px; font-weight: 800;">${fmtDuration(maxDuration)}</div>
                            </div>
                            <div style="flex: 1;">
                                <div style="color: var(--text-secondary); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px;">Shortest Trade</div>
                                <div style="color: var(--text-primary); font-family: var(--font-quant); font-size: 18px; font-weight: 800;">${fmtDuration(minDuration)}</div>
                            </div>
                        </div>`;
                    container.insertAdjacentHTML('afterend', summaryHtml);
                }
            }
        }

        // ═══ EVENTS ═══

        document.addEventListener('DOMContentLoaded', async () => {
            // Auth check
            try {
                const authRes = await fetch('/api/auth/status');
                const authData = await authRes.json();
                if (!authData.authenticated || !authData.user.is_verified) {
                    window.location.href = '/godbot_login';
                    return;
                }
            } catch (err) {
                window.location.href = '/godbot_login';
                return;
            }

            initPage();
        });
    </script>
    <!-- Shared nav drawer: keeps the menu reachable off the home terminal -->
    <script src="/common/nav.js?v=2"></script>
</body>
</html>
